<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akiba Store - Mi Perfil y Seguridad</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-image: url('img/loginyregistro.jpg') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #111;
            color: #f8f9fa;
        }

        h2, h5, .navbar-brand {
            font-family: 'Dela Gothic One', sans-serif !important;
            letter-spacing: 0.5px;
        }

        .capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        nav, main, footer {
            position: relative;
            z-index: 2;
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.12) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #fff;
        }

        .form-control-glass {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control-glass::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .form-control-glass:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: #dc3545;
            color: #fff;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
        }

        .avatar-option {
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .avatar-option:hover {
            transform: scale(1.08);
            border-color: #dc3545 !important;
        }
        .avatar-selected {
            border: 3px solid #dc3545 !important;
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.8);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="capa-oscura"></div>

    <!-- 1. BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand text-light d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.gif" alt="Logo Akiba Store" width="40" height="40" class="rounded-circle border border-danger object-fit-cover">
                <span>Akiba <span class="text-danger">Store</span></span>
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <!-- 2. CONTENIDO DEL PERFIL Y SEGURIDAD -->
    <main class="container my-auto py-5 flex-grow-1 d-flex justify-content-center align-items-center" style="max-width: 650px;">
        <div class="card card-glass p-4 p-md-5 w-100 shadow-lg">
            
            <div class="text-center mb-4">
                <h2 class="text-white fs-3 mb-1">Mi Perfil y Seguridad</h2>
                <p class="text-white-50 small">Actualiza tu identidad visual o gestiona tu contraseña de acceso.</p>
            </div>

            <div id="alertaPerfil" class="alert d-none" role="alert"></div>

            <!-- FORMULARIO 1: DATOS PERSONALES Y AVATAR -->
            <form id="formPerfil" class="mb-4 pb-4 border-bottom border-secondary border-opacity-50">
                <h5 class="text-white fs-6 mb-3"><i class="bi bi-person-badge me-2 text-danger"></i>Información Personal</h5>
                
                <div class="text-center mb-3">
                    <img id="previewAvatar" src="img/logo.gif" alt="Avatar actual" width="90" height="90" class="rounded-circle border border-danger object-fit-cover shadow mb-3">
                    
                    <div class="mb-3">
                        <label for="nombrePerfil" class="form-label text-white-50 small">Nombre de Usuario</label>
                        <input type="text" class="form-control form-control-glass text-center fw-bold mx-auto py-2" id="nombrePerfil" style="max-width: 280px;" required>
                    </div>

                    <div class="mb-3">
                        <label for="inputSubirFoto" class="form-label text-white-50 small d-block">Subir foto desde tu equipo:</label>
                        <input type="file" class="form-control form-control-glass form-control-sm mx-auto" id="inputSubirFoto" accept="image/*" style="max-width: 300px;">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white-50 small d-block text-center mb-2">O elige un avatar de la colección:</label>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <img src="img/rock.jpg" alt="Rock" width="55" height="55" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/rock.jpg', this)">
                        <img src="img/chicaanime.jpg" alt="Chica Anime" width="55" height="55" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/chicaanime.jpg', this)">
                        <img src="img/chica2.jpg" alt="Chica 2" width="55" height="55" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/chica2.jpg', this)">
                        <img src="img/cine.jpg" alt="Cine" width="55" height="55" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/cine.jpg', this)">
                        <img src="img/logo.gif" alt="Logo" width="55" height="55" class="rounded-circle border border-secondary object-fit-cover avatar-option" onclick="seleccionarAvatar('img/logo.gif', this)">
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold shadow">Guardar Cambios de Perfil</button>
            </form>

            <!-- FORMULARIO 2: CAMBIAR / RESTABLECER CONTRASEÑA -->
            <form id="formPassword">
                <h5 class="text-white fs-6 mb-3"><i class="bi bi-shield-lock-fill me-2 text-danger"></i>Seguridad y Contraseña</h5>
                
                <div class="mb-3">
                    <label for="passActual" class="form-label text-white-50 small">Contraseña Actual</label>
                    <input type="password" class="form-control form-control-glass py-2" id="passActual" placeholder="Ingresa tu clave actual" required>
                </div>

                <div class="mb-3">
                    <label for="passNueva" class="form-label text-white-50 small">Nueva Contraseña (mín. 6 caracteres)</label>
                    <input type="password" class="form-control form-control-glass py-2" id="passNueva" placeholder="Ingresa tu nueva clave" required>
                </div>

                <div class="mb-3">
                    <label for="passConfirmar" class="form-label text-white-50 small">Confirmar Nueva Contraseña</label>
                    <input type="password" class="form-control form-control-glass py-2" id="passConfirmar" placeholder="Repite la nueva clave" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-outline-light w-50 py-2 fw-bold">Actualizar Clave</button>
                    <button type="button" onclick="restablecerContraseñaSistema()" class="btn btn-outline-warning w-50 py-2 fw-bold" title="Restablecer clave por defecto">Restablecer</button>
                </div>
            </form>

        </div>
    </main>

    <!-- 3. FOOTER -->
    <footer class="bg-transparent text-light py-3 text-center">
        <div class="container">
            <p class="mb-0 text-white-50 small">&copy; 2026 Akiba Store. Creado por Seba.</p>
        </div>
    </footer>

    <!-- Script de lógica de perfil y contraseñas -->
    <script>
        let avatarSeleccionado = localStorage.getItem("akiba_avatar") || "img/logo.gif";

        document.addEventListener("DOMContentLoaded", function() {
            const nombreActual = localStorage.getItem("akiba_nombre") || "Usuario Akiba";
            document.getElementById("nombrePerfil").value = nombreActual;
            document.getElementById("previewAvatar").src = avatarSeleccionado;
        });

        function seleccionarAvatar(rutaImagen, elementoImg) {
            avatarSeleccionado = rutaImagen;
            document.getElementById("previewAvatar").src = rutaImagen;
            document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('avatar-selected'));
            elementoImg.classList.add('avatar-selected');
        }

        document.getElementById("inputSubirFoto").addEventListener("change", function(e) {
            const archivo = e.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(evento) {
                    avatarSeleccionado = evento.target.result;
                    document.getElementById("previewAvatar").src = avatarSeleccionado;
                    document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('avatar-selected'));
                };
                lector.readAsDataURL(archivo);
            }
        });

        // 1. Guardar cambios de perfil (Nombre y Avatar)
        document.getElementById("formPerfil").addEventListener("submit", function(e) {
            e.preventDefault();
            const nuevoNombre = document.getElementById("nombrePerfil").value.trim();
            const alerta = document.getElementById("alertaPerfil");

            if (nuevoNombre === "") return;

            localStorage.setItem("akiba_nombre", nuevoNombre);
            localStorage.setItem("akiba_avatar", avatarSeleccionado);

            alerta.className = "alert alert-success bg-success text-white border-0 small text-center";
            alerta.textContent = "¡Perfil actualizado con éxito!";
            alerta.classList.remove('d-none');

            setTimeout(() => { alerta.classList.add('d-none'); }, 3000);
        });

        // 2. Cambiar Contraseña
        document.getElementById("formPassword").addEventListener("submit", function(e) {
            e.preventDefault();
            const passActualIngresada = document.getElementById("passActual").value;
            const passNueva = document.getElementById("passNueva").value;
            const passConfirmar = document.getElementById("passConfirmar").value;
            const alerta = document.getElementById("alertaPerfil");

            // Obtener clave real guardada (o valor por defecto "123456")
            const passRegistrada = localStorage.getItem("akiba_reg_pass") || "123456";

            if (passActualIngresada !== passRegistrada) {
                alerta.className = "alert alert-danger bg-danger text-white border-0 small text-center";
                alerta.textContent = "La contraseña actual es incorrecta.";
                alerta.classList.remove('d-none');
                return;
            }

            if (passNueva.length < 6) {
                alerta.className = "alert alert-danger bg-danger text-white border-0 small text-center";
                alerta.textContent = "La nueva contraseña debe tener al menos 6 caracteres.";
                alerta.classList.remove('d-none');
                return;
            }

            if (passNueva !== passConfirmar) {
                alerta.className = "alert alert-danger bg-danger text-white border-0 small text-center";
                alerta.textContent = "Las nuevas contraseñas no coinciden.";
                alerta.classList.remove('d-none');
                return;
            }

            // Guardar nueva clave
            localStorage.setItem("akiba_reg_pass", passNueva);

            alerta.className = "alert alert-success bg-success text-white border-0 small text-center";
            alerta.textContent = "¡Contraseña cambiada con éxito!";
            alerta.classList.remove('d-none');

            document.getElementById("formPassword").reset();
            setTimeout(() => { alerta.classList.add('d-none'); }, 3000);
        });

        // 3. Restablecer Contraseña (por si el usuario se enreda o quiere volver al valor inicial de emergencia)
        function restablecerContraseñaSistema() {
            const confirmar = confirm("¿Deseas restablecer tu contraseña al valor por defecto (123456)?");
            const alerta = document.getElementById("alertaPerfil");

            if (confirmar) {
                localStorage.setItem("akiba_reg_pass", "123456");
                alerta.className = "alert alert-warning bg-warning text-dark border-0 small text-center fw-bold";
                alerta.textContent = "Contraseña restablecida a la clave por defecto: 123456";
                alerta.classList.remove('d-none');
                document.getElementById("formPassword").reset();
                setTimeout(() => { alerta.classList.add('d-none'); }, 4000);
            }
        }
    </script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
