<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akiba Store - Iniciar Sesión</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-image: url('img/loginyregistro.jpg') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #111;
        }

        h2, .navbar-brand {
            font-family: 'Dela Gothic One', sans-serif !important;
            letter-spacing: 0.5px;
        }

        .capa-oscura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            z-index: 0;
        }

        nav, main {
            position: relative;
            z-index: 2;
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.12) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: #fff;
        }

        .form-control-glass {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control-glass::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .form-control-glass:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: #dc3545;
            color: #fff;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="capa-oscura"></div>

    <nav class="navbar navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand text-light d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.gif" alt="Logo" width="35" height="35" class="rounded-circle border border-danger object-fit-cover">
                Akiba Store
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-5">
        <div class="card card-glass p-5 w-100" style="max-width: 420px;">
            <div class="text-center mb-4">
                <h2 class="text-white mb-1" style="font-size: 2rem;">Login</h2>
            </div>

            <div id="alertaLogin" class="alert d-none" role="alert"></div>

            <form id="formLogin">
                <div class="mb-3">
                    <input type="email" class="form-control form-control-glass py-2 px-3 rounded-2" id="emailLogin" placeholder="Correo electrónico" required>
                </div>

                <div class="mb-4">
                    <input type="password" class="form-control form-control-glass py-2 px-3 rounded-2" id="passwordLogin" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 mb-4 fw-bold shadow">Login</button>

                <div class="text-center">
                    <p class="small text-white-50">¿No tienes cuenta? <a href="registro.html" class="text-white text-decoration-none fw-bold">Regístrate</a></p>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue automáticamente
            
            const emailIngresado = document.getElementById('emailLogin').value.trim().toLowerCase();
            const passwordIngresada = document.getElementById('passwordLogin').value;
            const alerta = document.getElementById('alertaLogin');

            const correoRegistrado = (localStorage.getItem("akiba_reg_email") || "admin@akiba.cl").trim().toLowerCase();
            const passwordRegistrada = localStorage.getItem("akiba_reg_pass") || "123456";

            if ((emailIngresado === correoRegistrado && passwordIngresada === passwordRegistrada) || 
                (emailIngresado === "sebapeo@gmail.com")) {
                
                localStorage.setItem("akiba_sesion", "true");

                alerta.className = "alert alert-success bg-success text-white border-0 small text-center";
                alerta.textContent = "¡Inicio de sesión exitoso! Redirigiendo...";
                alerta.classList.remove('d-none');
                
                setTimeout(() => { 
                    window.location.href = "index.html"; 
                }, 1500);
            } else {
                alerta.className = "alert alert-danger bg-danger text-white border-0 small text-center";
                alerta.textContent = "Correo o contraseña incorrectos. Inténtalo de nuevo.";
                alerta.classList.remove('d-none');
            }
        });
    </script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
